<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>小議 會議助理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 桌面程式式三段 — 左側欄（錄音、搜尋、依類型分資料夾的會議清單）＋主區（標題列、分頁內容）＋底部錄音列 */
:root {
  --bg: #fbfbfa;
  --side: #f2f3f1;
  --surface: #ffffff;
  --surface-2: #f2f4f3;
  --ink: #1c2120;
  --muted: #727b78;
  --line: #e3e6e4;
  --accent: #127a63;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ec;
  --wake: #a85d0c;
  --wake-soft: #fcf0df;
  --danger: #c0352b;
  --danger-soft: #fbe7e5;
  --ok: #1d7a3e;
  --c1: #3b82c4; --c2: #b0508f; --c3: #4f9a3c; --c4: #c0792a; --c5: #7a5cc4; --c6: #2a9aa0; --c7: #c4485a; --c8: #7d8a86;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e21; --side: #17181a; --surface: #232427; --surface-2: #2a2c30; --ink: #e8e9ea; --muted: #9a9ea3;
    --line: #34363b; --accent: #3fbf9c; --accent-ink: #0b211b; --accent-soft: #1f3a33;
    --wake: #e7a55a; --wake-soft: #3a2b16; --danger: #ef8a81; --danger-soft: #3d201d; --ok: #6fd39a;
    --c1: #6aa9e8; --c2: #d77fb9; --c3: #82c46c; --c4: #e3a35a; --c5: #a68ae6; --c6: #5cc4c9; --c7: #e47a8a; --c8: #9aa5a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1e21; --side: #17181a; --surface: #232427; --surface-2: #2a2c30; --ink: #e8e9ea; --muted: #9a9ea3;
  --line: #34363b; --accent: #3fbf9c; --accent-ink: #0b211b; --accent-soft: #1f3a33;
  --wake: #e7a55a; --wake-soft: #3a2b16; --danger: #ef8a81; --danger-soft: #3d201d; --ok: #6fd39a;
  --c1: #6aa9e8; --c2: #d77fb9; --c3: #82c46c; --c4: #e3a35a; --c5: #a68ae6; --c6: #5cc4c9; --c7: #e47a8a; --c8: #9aa5a1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1; }
.inp, .field input, .field select, textarea { width: 100%; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 12px; font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; }
.iconbtn svg { width: 17px; height: 17px; }

/* 外框 */
.shell { height: 100%; display: grid; grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: auto; min-height: 100%; } }

/* 側欄 */
.side { grid-row: 1 / 3; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 12px 10px; gap: 10px; }
@media (max-width: 860px) { .side { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 46vh; } }
.side .top { display: flex; gap: 6px; }
.side .top .btn { flex: 1; justify-content: center; padding-block: 7px; }
.search { position: relative; }
.search input { padding-left: 30px; background: var(--surface); }
.search svg { position: absolute; left: 9px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--muted); }
.nav { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 2px; }
.nav .grp { display: flex; align-items: center; gap: 6px; padding: 10px 8px 4px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.nav .grp svg { width: 15px; height: 15px; }
.nav .it { border: 0; background: transparent; text-align: left; border-radius: 7px; padding: 6px 8px 6px 28px; display: grid; gap: 0; width: 100%; }
.nav .it:hover { background: var(--surface-2); }
.nav .it[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.nav .it .nm { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .it .st { font-size: 11.5px; color: var(--muted); }
.nav .none { padding: 4px 8px 4px 28px; font-size: 12px; color: var(--muted); }
.side .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 6px; }

/* 主區 */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 18px 28px 0; display: grid; gap: 8px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.title { font-size: 24px; font-weight: 700; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 0 6px; margin-left: -7px; min-width: 0; flex: 1 1 280px; }
.title:hover, .title:focus { border-color: var(--line); background: var(--surface); }
.metarow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.metarow .mi { display: inline-flex; align-items: center; gap: 5px; }
.metarow svg { width: 15px; height: 15px; }
.plain { border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 6px; padding: 1px 4px; font-size: 13px; cursor: pointer; }
.plain:hover, .plain:focus { border-color: var(--line); background: var(--surface); color: var(--ink); }
.nav .grp { cursor: default; }
.nav .grp .gname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .grp .gact { visibility: hidden; border: 0; background: transparent; color: var(--muted); padding: 0 4px; border-radius: 5px; }
.nav .grp:hover .gact, .nav .grp:focus-within .gact { visibility: visible; }
.nav .grp .gact:hover { background: var(--surface); color: var(--ink); }
.nav .grp.drop, .nav .it.drop { background: var(--accent-soft); border-radius: 7px; }
.nav .grp input { flex: 1; padding: 2px 6px; font-size: 12.5px; }
.nav .sechd { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 2px; font-size: 11.5px; color: var(--muted); letter-spacing: .06em; }
.nav .sechd button { border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 5px; }
.nav .sechd button:hover { background: var(--surface); color: var(--ink); }
.nav .it { cursor: pointer; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px; display: grid; gap: 2px; min-width: 190px; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
.menu .pop .btn { justify-content: flex-start; border-color: transparent; background: transparent; }
.menu .pop .btn:hover { background: var(--surface-2); }

/* 發言人（彩色編號） */
.speakers { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.speakers .lbl { font-size: 12px; color: var(--muted); }
.spk { border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 1px 9px 1px 3px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; color: var(--c, var(--muted)); }
.spk .k { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-family: var(--font-mono); border: 1.5px solid currentColor; }
.spk[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); border-color: color-mix(in srgb, var(--c, var(--accent)) 45%, transparent); font-weight: 500; }
.speakers > .small { display: none; }

.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.field.full { grid-column: 1 / -1; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.chip .k { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.attrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.attrow > svg { width: 15px; height: 15px; }
.chip .x { border: 0; background: transparent; color: var(--muted); padding: 0 0 0 2px; font-size: 14px; line-height: 1; cursor: pointer; }
.chip .x:hover { color: var(--ink); }
.chip.add { border-style: dashed; color: var(--muted); cursor: pointer; }
.chip.add:hover, .chip.sug:hover { color: var(--ink); border-color: var(--ink); }
.chip.sug { cursor: pointer; }
.picker { display: grid; gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.picker .lbl { font-size: 12px; color: var(--muted); }
.importbig { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.tabs { display: flex; gap: 22px; padding: 6px 28px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 2px; font-size: 14.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tabs .tabbadge { font-size: 11px; color: var(--wake); margin-left: 4px; }
.pane { flex: 1; overflow-y: auto; min-height: 0; }
.pane .bd { padding: 16px 28px; display: grid; gap: 12px; max-width: 980px; }

/* 紀錄 */
.viewsw { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.viewsw button { border: 0; background: var(--surface); padding: 4px 12px; font-size: 13px; color: var(--muted); }
.viewsw button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.gen { display: grid; gap: 10px; padding: 56px 24px; place-items: center; text-align: center; color: var(--muted); }
.gen h2 { color: var(--ink); font-size: 17px; }
.sec { padding: 12px 28px; display: grid; gap: 8px; max-width: 980px; }
.sec h2 { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: .03em; }
.sec textarea { border: 1px solid transparent; background: transparent; padding: 4px 6px; resize: vertical; line-height: 1.8; font-size: 14.5px; }
.sec textarea:hover, .sec textarea:focus { border-color: var(--line); background: var(--surface); }
#rvMd { min-height: 360px; }
textarea.short { min-height: 80px; }
.confirmbar { margin: 14px 28px 0; max-width: 924px; border: 1px solid color-mix(in srgb, var(--wake) 55%, transparent); background: var(--wake-soft); border-radius: 9px; }
.confirmbar summary { cursor: pointer; padding: 8px 12px; font-size: 13.5px; font-weight: 500; color: var(--wake); }
.confirmbar .qs { display: grid; gap: 8px; padding: 0 12px 12px; }
.confirmbar .q { display: grid; gap: 4px; font-size: 13.5px; }
.tblwrap { overflow-x: auto; }
table.todos { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
table.todos th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px; border-bottom: 1px solid var(--line); }
table.todos td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.todos input[type=text], table.todos select, table.todos input[type=date] { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
table.todos .quote { font-size: 12px; color: var(--muted); margin-top: 4px; }
.missing { border-color: var(--wake) !important; }

/* 心智圖 */
.mm { position: relative; padding: 8px 12px 24px; }
.mmzoom { position: sticky; top: 8px; display: flex; justify-content: flex-end; gap: 6px; align-items: center; z-index: 2; padding-right: 16px; color: var(--muted); font-size: 12px; }
.mmwrap { overflow: auto; }
.mm svg text { font-family: var(--font-body); }

/* 逐字稿 */
.trbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 28px; border-bottom: 1px solid var(--line); }
.src { border-bottom: 1px solid var(--line); background: var(--surface-2); padding: 12px 28px; display: grid; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--surface); border: 1px solid var(--line); padding: 3px; border-radius: 8px; width: fit-content; }
.seg button { border: 0; background: transparent; padding: 3px 11px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.srcpane { display: grid; gap: 8px; }
.online { display: grid; gap: 8px; padding: 10px 28px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.transcript { padding: 8px 0; }
.line { display: grid; grid-template-columns: 58px 160px minmax(0, 1fr); gap: 10px; padding: 5px 28px; align-items: start; }
.line:hover { background: var(--surface-2); }
.line .t { font-size: 12px; color: var(--muted); padding-top: 3px; font-family: var(--font-mono); }
.line select { border: 0; background: transparent; font-weight: 500; font-size: 13px; padding: 0; color: var(--accent); max-width: 100%; }
.line .tx { min-width: 0; overflow-wrap: anywhere; font-size: 14.5px; }
.line.wake { background: var(--wake-soft); }
.line.wake .tx::before { content: "小議 "; font-size: 11px; font-weight: 700; color: var(--wake); border: 1px solid var(--wake); border-radius: 4px; padding: 0 4px; margin-right: 6px; }
.partial { color: var(--muted); font-style: italic; }
@media (max-width: 560px) { .line { grid-template-columns: 52px minmax(0, 1fr); } .line .tx { grid-column: 1 / -1; } }
.empty { padding: 56px 24px; color: var(--muted); display: grid; gap: 8px; max-width: 46ch; margin: 0 auto; text-align: center; }
.empty strong { color: var(--ink); font-size: 16px; }
.manual { display: flex; gap: 8px; padding: 10px 28px 4px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--bg); }
.manual input { flex: 1; }
.autoc { display: flex; gap: 6px; align-items: center; padding: 0 28px 10px; background: var(--bg); position: sticky; bottom: 0; }
.listening { margin: 8px 28px 0; border: 1px dashed var(--wake); background: var(--wake-soft); border-radius: 7px; padding: 6px 10px; }
.notice { padding: 9px 13px; border-radius: 8px; font-size: 13px; background: var(--surface-2); }
.notice.warn { background: var(--wake-soft); }
.notice.err { background: var(--danger-soft); color: var(--danger); }
.s-ok { color: var(--ok); } .s-err { color: var(--danger); } .s-run { color: var(--wake); }

/* 問小議／追蹤 */
.ask { display: flex; gap: 6px; }
.ask input { flex: 1; }
.qa { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.qa:first-child { border-top: 0; padding-top: 0; }
.qa .q { font-weight: 700; }
.qa .a { overflow-wrap: anywhere; }
.qa .a ul { margin: 4px 0; padding-left: 20px; }
.qa .a a { color: var(--accent); }
.qa .st { font-size: 12px; color: var(--muted); }
.qa .err { color: var(--danger); font-size: 13px; }
.prevpick { display: grid; gap: 8px; max-width: 560px; }
.prevlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.prevlist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
.prevlist .who { font-weight: 700; color: var(--accent); }
.prevlist .meta2 { font-size: 12px; color: var(--muted); }

/* 底部錄音列 */
.dock { grid-column: 2; border-top: 1px solid var(--line); background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 20px; }
@media (max-width: 860px) { .dock { grid-column: 1; position: sticky; bottom: 0; } }
.rec { border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; gap: 8px; }
.rec .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.rec.on { background: var(--danger); color: #fff; }
.rec.on .dot { animation: pulse 1.2s ease-in-out infinite; }
.rec:disabled { opacity: .45; cursor: not-allowed; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rec.on .dot { animation: none; } }
.timer { font-size: 16px; }
.recstate { font-size: 12px; color: var(--muted); }
.lvl { flex: 1; min-width: 80px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.lvl i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

/* 寫入 monday 側抽屜 */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.18); z-index: 30; display: flex; flex-direction: column; }
.drawer .dh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer .db { padding: 16px 18px; overflow-y: auto; display: grid; gap: 12px; align-content: start; }
.drawer .field label { font-size: 12px; }
.steplist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.steplist li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.confirm { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
</style>

<div class="shell">
  <!-- 側欄 -->
  <aside class="side" aria-label="會議清單">
    <div class="top">
      <button class="btn primary" type="button" id="draftNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M12 5v14M5 12h14"/></svg>新會議</button>
      <button class="iconbtn" type="button" id="goAsk" title="問小議" aria-label="問小議"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="inp" id="meetSearch" placeholder="搜尋所有會議" aria-label="搜尋所有會議"></label>
    <nav class="nav" id="meetList" aria-label="會議"></nav>
    <div class="foot"><span id="draftCount"></span><span>草稿存在這台電腦</span></div>
  </aside>

  <!-- 主區 -->
  <main class="main" id="viewLive">
    <div class="head">
      <div class="titlerow">
        <input class="title" id="mName" aria-label="會議主題">
        <button class="btn primary" type="button" id="writeOpen">寫入 monday</button>
        <details class="menu"><summary class="btn">⋯ 更多</summary>

<script>
(() => {

  const MONDAY = "monday.com";
  const BOARD = 5025207374;
  const SUB_BOARD = 5025771383;

  const COL = { date: "date4", type: "single_select89kse7k", loc: "single_select00596y3", doc: "doc_mky0mdvx", check: "color_mky2v7m7", open: "long_text_mkz7dqgp" };
  const SUBCOL = { person: "person", timeline: "timerange_mkz3bzhh", status: "status", quote: "long_text_mkzap4g1" };
  const GROUP_BY_TYPE = { "例行會議": "topics", "專案會議": "group_title", "管理會議": "group_mky0m8wy", "跨部門會議": "group_mky0jr7s" };
  const LOCATIONS = ["【研發】201小會議室", "【研發】202大會議室", "【本廠】1F大會議室", "【本廠】1F小會議室", "【本廠】2F大會議室(前)", "【本廠】2F小會議室(後)", "【本廠】3F大會議室", "【本廠】3F小會議室", "【彰濱】會議室", "【台中】會議室", "【線上會議】"];
  // 研發文管課（monday 團隊 29698）成員，名稱與 monday 一致
  const TEAM = [
    { id: 77446259, name: "Michael.Ma_馬洪鈞", short: "洪鈞" },
    { id: 77562661, name: "Ritana.Chen_陳芯宜", short: "芯宜" },
    { id: 77562671, name: "Ann.Shih_施俞安", short: "俞安" },
    { id: 79546935, name: "Jennifer.Huang_黃宜靖", short: "宜靖" },
    { id: 90238788, name: "Sandy.Huang_黃怡珊", short: "怡珊" },
    { id: 95449955, name: "Cheryl.Wang_王詩涵", short: "詩涵" },
    { id: 96075570, name: "Susan.Su_蘇珊慧", short: "珊慧" },
  ];
  const WAKE = /(小議|小義|小易|曉議|小譯|小意)[，,、。\s]*/;
  const STORE_KEY = "xiaoyi-draft-v1";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const clock = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  function isoWeek(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return { year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 86400000 + 1) / 7) };
  }
  const defaultName = (date) => { const w = isoWeek(date); return `${String(w.year).slice(2)}W${pad(w.week)}研發文管課週會`; };
  // 與會者名冊：課內同仁為預設，可加入任何 monday 使用者或外部人士（key = monday id 或 "n:名字"）
  const mkPerson = (id, name, unit) => {
    const zh = String(name).split("_")[1];
    const short = zh ? (zh.length >= 3 ? zh.slice(-2) : zh) : String(name).trim();
    return { key: id ? String(id) : "n:" + short, id: id || null, name: String(name), short, unit: unit || "" };
  };
  const TEAM_PEOPLE = TEAM.map((p) => ({ key: String(p.id), id: p.id, name: p.name, short: p.short, unit: "研發文管課" }));
  const person = (key) => S.people.find((p) => p.key === String(key));
  const shortOf = (key) => (key ? person(key)?.short : null) || "其他";
  const label = (p) => (p ? (p.id ? p.name : p.short) : "其他"); // 畫面顯示用：monday 使用者顯示 monday 上的名稱
  const labelOf = (key) => (key && person(key) ? label(person(key)) : "其他");
  const nameOf = (l) => (l.who ? shortOf(l.who) : (l.name || "其他"));
  const presentPeople = () => S.people.filter((p) => S.present.includes(p.key));
  function addPerson(p) { if (!person(p.key)) S.people.push(p); if (!S.present.includes(p.key)) S.present.push(p.key); save(); return person(p.key); }
  function matchPerson(label) {
    const s = String(label || "").trim().toLowerCase(); if (!s) return null;
    return S.people.find((p) => {
      const full = p.name.toLowerCase(), zh = (p.name.split("_")[1] || "").toLowerCase();
      const en = p.name.split("_")[0].toLowerCase(), first = en.split(".")[0];
      return s === p.short.toLowerCase() || s === full || s.includes(p.short.toLowerCase()) || (zh && s.includes(zh)) || (p.name.includes("_") && (s === en || s === first || s.startsWith(first + " ") || s.startsWith(first + ".")));
    }) || null;
  }

  // ---------- state：可同時保留多場會議草稿，S 永遠是目前選取的那一場 ----------
  const DRAFTS_KEY = "xiaoyi-drafts-v2";
  const blankDraft = () => {
    const d = today();
    return { meta: { name: defaultName(d), date: d, type: "例行會議", loc: "" }, folder: null, people: [], present: [], lines: [], elapsed: 0, review: null, updated: Date.now() };
  };
  // 自訂資料夾（只存在這台電腦）；會議的 folder 為 null 時放在「其他會議」
  const FOLDERS_KEY = "xiaoyi-folders-v1";
  let folders = [];
  try { folders = JSON.parse(localStorage.getItem(FOLDERS_KEY) || "[]") || []; } catch (_) { folders = []; }
  const saveFolders = () => { try { localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders)); } catch (_) {} };
  const S = { ...blankDraft(), speaker: null };
  let drafts = {}, curId = null;
  const newId = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const toKey = (v) => (v === null || v === undefined || v === "" ? null : String(v));
  function normalize() {
    // 舊版草稿以數字 id 記錄，轉成 key 字串；補上新加入的課內成員
    S.present = (S.present || []).map(toKey).filter(Boolean);
    (S.lines || []).forEach((l) => { l.who = toKey(l.who); });
    if (S.review) S.review.todos.forEach((t) => { t.owner = toKey(t.owner); });
    S.people = S.people || [];
    S.people.forEach((p) => { const t = TEAM_PEOPLE.find((x) => x.key === p.key); if (t) { p.name = t.name; p.short = t.short; } });
    if (S.speaker && !S.present.includes(S.speaker)) S.speaker = null;
  }
  // 一次性：舊版新會議會預設帶入課內 7 人；還沒開始記錄的草稿把這個預設拿掉
  function dropTeamDefault(d) {
    const keys = TEAM_PEOPLE.map((p) => p.key);
    if (!d || (d.lines || []).length || d.review) return;
    const pres = (d.present || []).map(String);
    if (pres.length === keys.length && keys.every((k) => pres.includes(k))) { d.present = []; d.people = (d.people || []).filter((p) => !keys.includes(String(p.key))); }
    if (d.meta && d.meta.loc === "【研發】201小會議室") d.meta.loc = "";
  }
  try {
    const store = JSON.parse(localStorage.getItem(DRAFTS_KEY) || "null");
    if (store?.drafts && Object.keys(store.drafts).length) { drafts = store.drafts; curId = drafts[store.current] ? store.current : Object.keys(drafts)[0]; }
    else {
      const old = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      curId = newId(); drafts[curId] = old && Array.isArray(old.lines) ? { ...blankDraft(), ...old, updated: Date.now() } : blankDraft();
    }
  } catch (_) { curId = newId(); drafts[curId] = blankDraft(); }
  try { if (!localStorage.getItem("xiaoyi-noteam-v1")) { Object.values(drafts).forEach(dropTeamDefault); localStorage.setItem("xiaoyi-noteam-v1", "1"); } } catch (_) {}
  Object.assign(S, drafts[curId]); normalize();
  const draftOf = () => ({ meta: S.meta, folder: S.folder || null, people: S.people, present: S.present, lines: S.lines, elapsed: S.elapsed, review: S.review, updated: Date.now() });
  function persist() { drafts[curId] = draftOf(); try { localStorage.setItem(DRAFTS_KEY, JSON.stringify({ current: curId, drafts })); } catch (_) {} }
  let saveT = 0;
  function save() { clearTimeout(saveT); saveT = setTimeout(() => { persist(); renderDrafts(); renderHead(); }, 400); }

  // ---------- capabilities ----------

    ready.dict = ready.sample = ready.mcp = true;
    setTimeout(setupDictation, 0); setTimeout(setupFileBox, 0);
  }

  function mcpMsg(e) {

      case "needs_reauth": return "monday 連線已過期，請到 claude.ai 設定 → Connectors 重新連線 monday.com。";

      case "not_in_manifest": case "approval_required": case "consent_required": return "這個頁面尚未獲准使用 monday.com，請在提示中按「允許」後再試一次。";
      case "blocked_by_policy": return "組織政策不允許這個操作。";

  }
  function sampleMsg(e) {
    switch (e?.code) {
      case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": case "capability_removed": return "此頁未獲准使用 Claude，無法分析。";
      case "rate_limited": return "使用量暫時達上限，請稍後再試。";

    if (!mcp) throw { code: "capability_disabled" };

  { const o = document.createElement("option"); o.value = ""; o.textContent = "選擇地點"; $("mLoc").append(o); }

  function renderHead() {

      ${confirmOpen ? `<div class="confirm"><b>確認寫入 monday？</b><span>將寫入「會議紀錄」板，寫入後可在 monday 修改或刪除。</span><div class="row"><button class="btn primary" id="doWrite" ${writing ? "disabled" : ""}>確認寫入</button><button class="btn" id="cancelWrite" ${writing ? "disabled" : ""}>取消</button></div></div>`
        : `<button class="btn primary" id="askWrite">寫入 monday…</button>`}

    const sel = $("tgt"); if (sel) sel.onchange = () => { R.target = sel.value === "new" ? "new" : Number(sel.value); save(); renderWrite(); };

  function stepLi(s) {
    const icon = { ok: "✓", err: "✕", run: "…", skip: "–" }[s.st] || "·";
    return `<li><span class="s-${s.st}">${icon}</span><span>${esc(s.label)}${s.msg ? `<br><span class="small ${s.st === "err" ? "s-err" : "muted"}">${esc(s.msg)}</span>` : ""}</span></li>`;
  }
  const cell = (s) => String(s || "").replace(/\|/g, "／").replace(/\n/g, " ");
  function docMarkdown(R) {
    const names = presentPeople().map((p) => p.short + (p.unit && p.unit !== "研發文管課" ? "（" + p.unit + "）" : "")).join("、");
    const keep = R.todos.filter((t) => t.keep && t.task.trim());
    let md = `## 🤖 小議會議紀錄（AI 草稿・待檢核）\n\n| 項目 | 內容 |\n| --- | --- |\n| 🎯 會議主題 | ${cell(S.meta.name)} |\n| 🚩 地點 | ${cell(S.meta.loc)} |\n| ✏️ 記錄者 | 小議（AI 整理） |\n| 👥 與會者 | ${cell(names)} |\n\n`;
    md += R.md.trim() + "\n\n";
    if (keep.length) {
      md += `### 📝 待辦事項\n\n| 事項 | 負責人 | 期限 |\n| --- | --- | --- |\n`;
      keep.forEach((t) => { md += `| ${cell(t.task)} | ${cell(t.owner ? shortOf(t.owner) : (t.ownerName || "未指定"))} | ${cell(t.due || "未定")} |\n`; });
      md += "\n";
    }
    if (R.open.trim()) md += `### ❓ 待確認問題\n\n${R.open.trim()}\n`;
    return md;
  }
  // ---------- 範本填寫：把內容寫進「會議內容」「待辦事項」格子，與會者用 @ 標記 ----------
  const NL = { insert: { text: "\n" } };
  function inlineDelta(t) {
    const out = [];
    String(t).split(/(\*\*[^*]+\*\*)/).forEach((seg) => {
      if (!seg) return;
      const b = seg.match(/^\*\*([^*]+)\*\*$/);
      out.push(b ? { insert: { text: b[1] }, attributes: { bold: true } } : { insert: { text: seg } });
    });
    return out;
  }
  function mdToBlocks(md) {
    const blocks = [];
    String(md || "").split(/\r?\n/).forEach((raw) => {
      const line = raw.replace(/\s+$/, ""); if (!line.trim()) return;
      let m;
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) blocks.push({ block_type: "text", text_block_type: "SMALL_TITLE", delta_format: [...inlineDelta(m[1].replace(/\*\*/g, "")), NL] });
      else if ((m = line.match(/^(\s*)[-*•]\s+(.*)$/))) blocks.push({ block_type: "list_item", list_block_type: "BULLETED_LIST", indentation: m[1].length >= 2 ? 1 : 0, delta_format: [...inlineDelta(m[2]), NL] });
      else if ((m = line.match(/^(\s*)\d+[.)]\s+(.*)$/))) blocks.push({ block_type: "list_item", list_block_type: "NUMBERED_LIST", indentation: m[1].length >= 2 ? 1 : 0, delta_format: [...inlineDelta(m[2]), NL] });
      else blocks.push({ block_type: "text", text_block_type: "NORMAL_TEXT", delta_format: [...inlineDelta(line.trim()), NL] });
    });
    return blocks.filter((b) => b.delta_format.length > 1);
  }
  function todoBlock(t) {
    const d = [{ insert: { text: t.task.trim() } }, { insert: { text: "｜負責人：" } }];
    const p = t.owner ? person(t.owner) : null;
    d.push(p?.id ? { insert: { mention: { id: p.id, type: "USER" } } } : { insert: { text: p ? p.short : (t.ownerName || "未指定") } });
    d.push({ insert: { text: "｜期限：" + (t.due || "未定") } }, NL);
    return { block_type: "list_item", list_block_type: "BULLETED_LIST", delta_format: d };
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function readTemplate(docObj) {
    const blocks = [];
    for (let page = 1; page <= 10; page++) {
      const p = await callMonday("read_docs", { type: "object_ids", ids: [String(docObj)], include_blocks: true, blocks_limit: 100, blocks_page: page });
      const d = p?.data?.[0]; if (!d) break;
      blocks.push(...(d.blocks || []));
      if (!d.blocks_pagination?.has_more_pages) break;
    }
    const parse = (b) => { try { return JSON.parse(b.content || "{}"); } catch (_) { return {}; } };
    const kids = {}; blocks.forEach((b) => { if (b.parent_block_id) (kids[b.parent_block_id] ||= []).push(b); });
    Object.values(kids).forEach((arr) => arr.sort((a, b) => a.position - b.position));
    const textOf = (b) => (parse(b).deltaFormat || []).map((x) => typeof x.insert === "string" ? x.insert : (x.insert?.mention ? "@" : "")).join("").trim();
    const cellText = (id) => (kids[id] || []).map(textOf).join(" ");
    const T = { kids, textOf, isEmpty: (id) => (kids[id] || []).every((b) => !textOf(b)), recorderCell: null, attendCell: null, contentCell: null, todoCell: null };
    blocks.filter((b) => b.type === "table" && !b.parent_block_id).forEach((tb) => {
      const rows = parse(tb).cells || [];
      rows.forEach((row, ri) => {
        const ids = row.map((c) => c.blockId);
        const head = cellText(ids[0]);
        if (ids.length >= 2 && head.includes("記錄者")) T.recorderCell = ids[1];
        if (ids.length >= 2 && head.includes("與會者")) T.attendCell = ids[1];
        if (ids.length === 1 && head.includes("會議內容") && rows[ri + 1]) T.contentCell = rows[ri + 1][0].blockId;
        if (ids.length === 1 && head.includes("待辦事項") && rows[ri + 1]) T.todoCell = rows[ri + 1][0].blockId;
      });
    });
    return T;
  }
  async function fillTemplate(docObj, R, progress, tries = 1) {
    let T = null;
    for (let i = 0; i < tries; i++) {
      if (i) { progress?.("等待 monday 套用範本…"); await sleep(2500); }
      T = await readTemplate(docObj);
      // 範本剛套用時格子可能還在產生：要同時找到「會議內容」格且格內已有佔位行
      if (T.contentCell && (T.kids[T.contentCell] || []).length) break;
    }
    if (!T?.contentCell) return false;
    const { kids, textOf, isEmpty, recorderCell, attendCell, contentCell, todoCell } = T;
    const ops = [];
    const firstText = (cell) => (kids[cell] || []).find((b) => /text/.test(b.type));
    if (recorderCell && isEmpty(recorderCell) && firstText(recorderCell)) ops.push({ operation_type: "update_block", block_id: firstText(recorderCell).id, content: { block_content_type: "text", delta_format: [{ insert: { text: "小議（AI 整理・待檢核）" } }, NL] } });
    if (attendCell && isEmpty(attendCell) && firstText(attendCell)) {
      const d = []; presentPeople().forEach((p) => { d.push(p.id ? { insert: { mention: { id: p.id, type: "USER" } } } : { insert: { text: p.short + (p.unit ? "（" + p.unit + "）" : "（外部）") } }, { insert: { text: " " } }); });
      if (d.length) ops.push({ operation_type: "update_block", block_id: firstText(attendCell).id, content: { block_content_type: "text", delta_format: [...d, NL] } });
    }
    let body = R.md.trim();
    if (R.open.trim()) body += "\n### ❓ 待確認問題\n" + R.open.trim();
    const keep = R.todos.filter((t) => t.keep && t.task.trim());
    mdToBlocks(body).forEach((b) => ops.push({ operation_type: "create_block", parent_block_id: contentCell, block: b }));
    if (keep.length) {
      const target = todoCell || contentCell;
      if (!todoCell) ops.push({ operation_type: "create_block", parent_block_id: contentCell, block: { block_type: "text", text_block_type: "SMALL_TITLE", delta_format: [{ insert: { text: "✅ 待辦事項" } }, NL] } });
      keep.forEach((t) => ops.push({ operation_type: "create_block", parent_block_id: target, block: todoBlock(t) }));
    }
    // 原本空白的佔位行，內容寫入後再刪除
    const blanks = [contentCell, todoCell].filter(Boolean).flatMap((c) => (kids[c] || []).filter((b) => !textOf(b)).map((b) => b.id));
    for (let i = 0; i < ops.length; i += 20) {
      progress?.(`寫入中 ${Math.min(i + 20, ops.length)}/${ops.length}`);
      await callMonday("update_doc", { object_id: String(docObj), operations: ops.slice(i, i + 20) });
    }
    if (blanks.length) { try { await callMonday("update_doc", { object_id: String(docObj), operations: [{ operation_type: "delete_blocks", block_ids: blanks.slice(0, 100) }] }); } catch (_) {} }
    return true;
  }

  function findId(p) {
    if (!p) return null;
    const cands = [p.item_id, p.itemId, p.id, p.item?.id, p.data?.id, p.data?.item?.id, p.create_item?.id];
    for (const c of cands) if (c && /^\d{6,}$/.test(String(c))) return Number(c);
    const m = JSON.stringify(p).match(/"(?:item_?id|id)"\s*:\s*"?(\d{6,})/i);
    return m ? Number(m[1]) : null;
  }
  async function doWrite() {
    const R = S.review; if (writing) return;
    writing = true; renderWrite();
    const steps = []; const list = () => { const el = $("stepList"); if (el) el.innerHTML = steps.map(stepLi).join(""); };
    const step = (label) => { const s = { label, st: "run" }; steps.push(s); list(); return s; };
    let itemId = R.target === "new" ? null : R.target;
    const tgt = (recent || []).find((r) => r.id === itemId);
    try {
      // 1. item
      if (!itemId) {
        const s = step("建立會議項目");
        const cv = { [COL.date]: { date: S.meta.date }, [COL.type]: { label: S.meta.type }, [COL.check]: { label: "待檢核" } };
        if (S.meta.loc) cv[COL.loc] = { label: S.meta.loc };
        if (R.open.trim()) cv[COL.open] = { text: R.open.trim() };
        const p = await callMonday("create_item", { boardId: BOARD, name: S.meta.name, groupId: GROUP_BY_TYPE[S.meta.type] || "topics", columnValues: JSON.stringify(cv) });
        itemId = findId(p);
        if (!itemId) { s.st = "err"; s.msg = "項目可能已建立，但讀不到它的 ID。請到 monday 確認後，改選「寫入既有」再寫一次。"; list(); throw null; }
        s.st = "ok"; s.msg = "#" + itemId; list();
      }
      // 2. doc：有範本就填進範本格子；沒有範本才另建文件
      {
        const s = step("寫入會議紀錄文件");
        try {
          // 新項目的範本文件是 monday 在建立後幾秒才套用的：先等文件與範本表格出現，再寫入
          const fresh = !tgt;
          let docObj = tgt?.docObj || null;
          for (let i = 0; !docObj && i < (fresh ? 10 : 1); i++) {
            if (i) { s.msg = "等待 monday 套用範本…"; list(); await sleep(2500); }
            const p = await callMonday("get_board_items_page", { boardId: BOARD, itemIds: [itemId], includeColumns: true, columnIds: [COL.doc] });
            docObj = p?.items?.[0]?.column_values?.[COL.doc]?.files?.[0]?.objectId || null;
          }
          if (docObj) {
            const filled = await fillTemplate(docObj, R, (t) => { s.msg = t; list(); }, fresh ? 10 : 2);
            if (!filled) await callMonday("update_doc", { object_id: String(docObj), operations: [{ operation_type: "add_markdown_content", markdown: docMarkdown(R) }] });
            s.label = filled ? "已填入範本「會議內容」與「待辦事項」" : "文件沒有範本格式，已附加在文件末尾";
          } else {
            await callMonday("create_doc", { location: "item", item_id: itemId, column_id: COL.doc, doc_name: "會議紀錄", markdown: docMarkdown(R) });
            s.label = "項目沒有範本文件，已另建紀錄文件";
          }
          s.st = "ok"; s.msg = "";
        } catch (e) { s.st = "err"; s.msg = mcpMsg(e); }
        list();
      }
      // 3. subitems
      const keep = R.todos.filter((t) => t.keep && t.task.trim());
      for (const t of keep) {
        const s = step("子項目：" + t.task.slice(0, 30));
        const cv = { [SUBCOL.status]: { label: "處理中" } };
        const op = t.owner ? person(t.owner) : null;
        if (op?.id) cv[SUBCOL.person] = { personsAndTeams: [{ id: op.id, kind: "person" }] };
        if (t.due) cv[SUBCOL.timeline] = { from: S.meta.date <= t.due ? S.meta.date : t.due, to: t.due };
        const who = op && !op.id ? `負責人：${op.short}（外部）` : (!op && t.ownerName ? `負責人：${t.ownerName}` : "");
        if (t.quote || who) cv[SUBCOL.quote] = { text: [who, t.quote].filter(Boolean).join("\n") };
        try { await callMonday("create_item", { boardId: SUB_BOARD, parentItemId: itemId, name: t.task.slice(0, 250), columnValues: JSON.stringify(cv) }); s.st = "ok"; }
        catch (e) { s.st = "err"; s.msg = mcpMsg(e); }
        list();
      }
      // 4. transcript update
      {
        const s = step("逐字稿貼到更新區");
        const body = S.lines.map((l) => `<p><b>[${esc(l.t)}] ${esc(nameOf(l))}</b>：${esc(l.text)}</p>`).join("");
        const capped = body.length > 60000 ? body.slice(0, 60000) + "<p>…（逐字稿過長，已截斷）</p>" : body;
        try { await callMonday("create_update", { itemId, body: `<h3>🎙 ${esc(S.meta.name)} 逐字稿（小議）</h3>${capped || "<p>（無）</p>"}` }); s.st = "ok"; }
        catch (e) { s.st = "err"; s.msg = mcpMsg(e); }
        list();
      }
      R.written = { url: `${BASE}/boards/${BOARD}/pulses/${itemId}`, steps };
      confirmOpen = false; save();
    } catch (e) {
      if (e) { const last = steps[steps.length - 1]; if (last && last.st === "run") { last.st = "err"; last.msg = mcpMsg(e); } }
      list();
    } finally {
      writing = false;
      if (R.written) renderWrite();
      else { const keepSteps = steps.slice(); confirmOpen = false; renderWrite(); const el = $("stepList"); if (el) el.innerHTML = keepSteps.map(stepLi).join("") + `<li><span></span><span class="small muted">寫入未完成。請先到 monday 確認已建立的內容，避免重複，再決定是否重試。</span></li>`; }
    }
  }
  // ---------- 會議清單：多場會議各自保存，可切換、新增、清空、刪除 ----------
  function stopActivity() {
    if (dict?.active()) dict.stop().catch(() => {});
    if (wsrOn) wsrStop();
    stopFollow(); partialText = ""; forceNewLine = true;
  }
  function loadDraft(id) {
    clearTimeout(saveT); persist(); stopActivity();
    curId = id; Object.assign(S, blankDraft(), drafts[id]); normalize();
    recent = null; confirmOpen = false; recentErr = "";
    persist(); renderAll();
  }
  function renderAll() {
    renderDrafts(); renderMeta(); renderSpeakers(); renderTranscript();
    $("timer").textContent = fmtElapsed(S.elapsed); setRecUI("idle");
    $("prevBody").innerHTML = `<div class="small muted">選擇要追蹤的會議，列出還沒完成的子項目待辦。</div>`; prevItems = null; renderPrevPicker();
    show(S.review ? "review" : "live");
  }
  function draftStatus(d) {
    if (d.review?.written) return "已寫入 monday";
    if (d.review) return "已整理・待寫入";
    return d.lines?.length ? `逐字稿 ${d.lines.length} 段` : "空白";
  }
  // 側欄：依會議類型分資料夾列出所有會議，可搜尋名稱與逐字稿內容
  const FOLDER_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
  // 會議可拖曳到資料夾；資料夾可新增、改名、刪除（刪除後會議回到「其他會議」）
  let editingFolder = null, folderForDraft = false;
  const draftById = (id) => (id === curId ? draftOf() : drafts[id]);
  function moveDraft(id, folderId) {
    if (id === curId) S.folder = folderId; else if (drafts[id]) drafts[id].folder = folderId;
    persist(); renderDrafts(); renderHead();
  }
  function startNewFolder(forCurrent) { editingFolder = "__new"; folderForDraft = !!forCurrent; renderDrafts(); }
  function commitFolder(name) {
    if (!editingFolder) return; // Enter 與失去焦點可能各觸發一次
    name = String(name || "").trim();
    if (editingFolder === "__new") {
      if (name) { const f = { id: "f" + Date.now().toString(36), name }; folders.push(f); if (folderForDraft) S.folder = f.id; }
    } else { const f = folders.find((x) => x.id === editingFolder); if (f && name) f.name = name; }
    editingFolder = null; folderForDraft = false; saveFolders(); persist(); renderDrafts(); renderHead();
  }
  function renderDrafts() {
    const nav = $("meetList"); if (!nav) return;
    const q = ($("meetSearch")?.value || "").trim().toLowerCase();
    const all = Object.keys(drafts).map((id) => [id, draftById(id)])
      .filter(([, d]) => !q || (d.meta?.name || "").toLowerCase().includes(q) || (d.lines || []).some((l) => String(l.text).toLowerCase().includes(q)) || (d.review?.md || "").toLowerCase().includes(q))
      .sort((a, b) => (b[1].meta?.date || "").localeCompare(a[1].meta?.date || "") || (b[1].updated || 0) - (a[1].updated || 0));
    nav.textContent = "";
    const dropTarget = (el, folderId) => {
      el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("drop"); });
      el.addEventListener("dragleave", () => el.classList.remove("drop"));
      el.addEventListener("drop", (e) => { e.preventDefault(); el.classList.remove("drop"); const id = e.dataTransfer.getData("text/plain"); if (drafts[id]) moveDraft(id, folderId); });
    };
    const item = ([id, d]) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "it"; b.draggable = true;
      b.setAttribute("aria-current", String(id === curId));
      b.title = "拖曳到資料夾即可移動";
      b.innerHTML = `<span class="nm">${esc(d.meta?.name || "（未命名）")}</span><span class="st">${esc((d.meta?.date || "").slice(5).replace("-", "/"))}・${esc(d.meta?.type || "")}・${esc(draftStatus(d))}</span>`;
      b.onclick = () => { if (id !== curId) loadDraft(id); };
      b.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; });
      return b;
    };
    const sec = document.createElement("div"); sec.className = "sechd";
    sec.innerHTML = `<span>資料夾</span><button type="button" title="新增資料夾" aria-label="新增資料夾">＋</button>`;
    sec.querySelector("button").onclick = () => startNewFolder(false);
    nav.append(sec);
    const folderInput = (val) => {
      const g = document.createElement("div"); g.className = "grp";
      g.innerHTML = FOLDER_SVG + `<input class="inp" value="${esc(val)}" placeholder="資料夾名稱，Enter 確定">`;
      const inp = g.querySelector("input");
      inp.onkeydown = (e) => { if (e.key === "Enter") commitFolder(inp.value); if (e.key === "Escape") { editingFolder = null; renderDrafts(); } };
      inp.onblur = () => commitFolder(inp.value);
      setTimeout(() => { inp.focus(); inp.select(); }, 0);
      return g;
    };
    folders.forEach((f) => {
      if (editingFolder === f.id) { nav.append(folderInput(f.name)); return; }
      const items = all.filter(([, d]) => d.folder === f.id);
      if (q && !items.length) return;
      const g = document.createElement("div"); g.className = "grp";
      g.innerHTML = FOLDER_SVG + `<span class="gname">${esc(f.name)}</span><button type="button" class="gact" data-a="rename" title="重新命名">✎</button><button type="button" class="gact" data-a="del" title="刪除資料夾">✕</button>`;
      g.querySelector('[data-a="rename"]').onclick = () => { editingFolder = f.id; renderDrafts(); };
      const del = g.querySelector('[data-a="del"]');
      del.onclick = () => {
        if (del.dataset.armed) { folders = folders.filter((x) => x.id !== f.id); Object.keys(drafts).forEach((id) => { if (draftById(id).folder === f.id) moveDraft(id, null); }); saveFolders(); renderDrafts(); renderHead(); return; }
        del.dataset.armed = "1"; del.textContent = "確定刪除？"; del.style.visibility = "visible"; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "✕"; del.style.visibility = ""; } }, 3000);
      };
      dropTarget(g, f.id); nav.append(g);
      items.forEach((x) => nav.append(item(x)));
      if (!items.length) { const n = document.createElement("div"); n.className = "none"; n.textContent = "把會議拖到這裡"; dropTarget(n, f.id); nav.append(n); }
    });
    if (editingFolder === "__new") nav.append(folderInput(""));
    const others = all.filter(([, d]) => !d.folder || !folders.some((f) => f.id === d.folder));
    const og = document.createElement("div"); og.className = "sechd"; og.innerHTML = `<span>其他會議</span>`; dropTarget(og, null); nav.append(og);
    others.forEach((x) => nav.append(item(x)));
    if (!others.length) { const n = document.createElement("div"); n.className = "none"; n.style.paddingLeft = "8px"; n.textContent = q ? `找不到「${q}」` : "沒有未分類的會議"; nav.append(n); }
    $("draftCount").textContent = `共 ${Object.keys(drafts).length} 場`;
  }
  $("meetSearch").oninput = renderDrafts;
  // 新會議放在「其他會議」，名稱先用「新會議 月/日」，標題直接可改
  $("draftNew").onclick = () => {
    clearTimeout(saveT); persist();
    const id = newId(), d = blankDraft();
    d.meta.name = `新會議 ${d.meta.date.slice(5).replace("-", "/")}`;
    drafts[id] = d; loadDraft(id);
    setTimeout(() => { $("mName").focus(); $("mName").select(); }, 0);
  };
  // 清空、刪除都要按兩次確認，避免誤按
  function twoStep(btn, normal, confirmText, action) {
    let armed = false, t = 0;
    btn.onclick = () => {
      if (!armed) { armed = true; btn.textContent = confirmText; btn.classList.add("danger"); t = setTimeout(() => { armed = false; btn.textContent = normal; btn.classList.remove("danger"); }, 4000); return; }
      clearTimeout(t); armed = false; btn.textContent = normal; btn.classList.remove("danger"); action();
    };
  }
  twoStep($("draftClear"), "清空逐字稿", "再按一次確認清空", () => { stopActivity(); S.lines = []; S.review = null; S.elapsed = 0; persist(); renderAll(); });
  twoStep($("draftDel"), "刪除這場", "再按一次確認刪除", () => {
    stopActivity(); delete drafts[curId];
    const left = Object.keys(drafts);
    if (!left.length) { const id = newId(); drafts[id] = blankDraft(); curId = id; } else curId = left.sort((a, b) => (drafts[b].updated || 0) - (drafts[a].updated || 0))[0];
    Object.assign(S, blankDraft(), drafts[curId]); normalize(); recent = null; persist(); renderAll();
  });
  function resetAll() { $("draftNew").click(); }

  // ---------- boot ----------
  S.lines.forEach((l) => { l.text = toTW(l.text); });
  persist(); renderDrafts();
  renderMeta(); renderSpeakers(); renderTranscript(); renderPrevPicker();
  $("timer").textContent = fmtElapsed(S.elapsed);
  renderReview(); selectTab(S.review ? "notes" : "transcript");
})();
</script>
